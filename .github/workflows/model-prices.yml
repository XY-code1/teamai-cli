name: PR 1910 real CLI verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run real CLI in a verify world
        shell: bash
        run: |
          set -euo pipefail
          RUN=$(npm run -s verify:world)
          echo "VERIFY_RUN=$RUN"
          npm run -s verify -- doctor "$RUN"
          npm run -s verify -- teamai "$RUN" init https://teamai.test/team/repo.git --provider git --agent opencode
          npm run -s verify -- sh "$RUN" sh -c 'mkdir -p .opencode/rules "$TMPDIR/outside-rules"; printf "INSIDE-RULE\n" > .opencode/rules/inside.md; printf "OUTSIDE-RULE\n" > "$TMPDIR/outside-rules/external.md"; ln -s "$TMPDIR/outside-rules" .opencode/rules/linked'
          cat > /tmp/verify-pr1910.mjs <<'EOF'
          import fs from 'node:fs';
          const source = fs.readFileSync('.opencode/plugin/teamai-hooks.ts', 'utf8');
          const plugin = (await import(`data:text/javascript;base64,${Buffer.from(source).toString('base64')}`)).default;
          let context;
          const registration = { dispose: async () => undefined };
          const cleanup = await plugin.setup({
            location: { directory: process.cwd() },
            session: { hook: async (name, callback) => { if (name === 'context') context = callback; return registration; } },
            tool: { hook: async () => registration },
            mcp: { transform: async () => registration },
            event: { subscribe: () => (async function* () {})() },
          });
          if (typeof context !== 'function') throw new Error('generated plugin did not register session.context');
          const event = { sessionID: 'verify-pr1910', system: [] };
          await context(event);
          await cleanup?.();
          const text = event.system.map((part) => part.text).join('\n');
          if (!text.includes('INSIDE-RULE')) throw new Error('ordinary in-root rule was not loaded');
          if (text.includes('OUTSIDE-RULE')) throw new Error('rule behind directory symlink escaped the configured root');
          console.log('PASS: generated OpenCode plugin loaded INSIDE-RULE and ignored OUTSIDE-RULE behind a directory symlink');
          EOF
          npm run -s verify -- sh "$RUN" node /tmp/verify-pr1910.mjs
          npm run -s verify -- ledger "$RUN"
          npm run -s verify -- cleanup "$RUN"
